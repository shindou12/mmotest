<!doctype html><html><head><meta charset="utf-8"><script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script><style>body{margin:0;background:#111821;color:#e9edf2;font-family:Arial}#root{position:relative;width:1280px;height:900px}canvas{position:absolute}header{position:absolute;left:30px;top:20px;font-size:20px}.label{position:absolute;left:20px;top:70px;color:#80ddcc;font-size:17px}.cell{position:absolute;width:426px;height:400px;pointer-events:none}.note{position:absolute;bottom:18px;left:30px;color:#a5b5c6;font-size:13px}</style></head><body><div id="root"><canvas></canvas><header>ETERNA / WEAPON GRIP AUDIT</header><div id="labels"></div><div class="note" id="note"></div></div><script type="module">
import * as THREE from 'three';import {makePlayer,setPlayerWeapon,animatePlayer} from './js/models.js';
const names=['sword','greatsword','spear','dagger','axe','bow'];const r=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,preserveDrawingBuffer:true});r.setSize(1280,900);r.setClearColor(0x111821);
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xdbf4ff,0x354050,2.4));const light=new THREE.DirectionalLight(0xffefd9,3);light.position.set(3,6,4);scene.add(light);
const models=names.map(n=>{const m=makePlayer('#448a9b');setPlayerWeapon(m,n,3,0);scene.add(m);return m});
const camera=new THREE.PerspectiveCamera(34,426/380,.1,100);camera.position.set(4.3,3.4,6.4);camera.lookAt(0,1.35,0);
document.querySelector('#labels').innerHTML=names.map((n,i)=>`<div class="cell" style="left:${i%3*426}px;top:${Math.floor(i/3)*400}px"><div class="label">${n.toUpperCase()}</div></div>`).join('');
window.auditModels=models;window.auditCamera=camera;window.auditDraw=(pose={},style=0)=>{r.setScissorTest(false);r.setViewport(0,0,1280,900);r.clear();r.setScissorTest(true);for(let i=0;i<6;i++){models.forEach((m,j)=>m.visible=i===j);setPlayerWeapon(models[i],names[i],3,style);animatePlayer(models[i],{t:1,moving:false,walkT:0,kind:names[i],combo:0,swing:-1,spin:-1,sweep:-1,dodge:0,down:0,hurt:0,...pose});r.setViewport(i%3*426,900-110-Math.floor(i/3)*400-380,426,380);r.setScissor(i%3*426,900-110-Math.floor(i/3)*400-380,426,380);r.render(scene,camera);}r.setScissorTest(false);document.querySelector('#note').textContent=JSON.stringify(pose)+' / style '+style;};window.auditDraw();window.ready=true;
</script></body></html>
