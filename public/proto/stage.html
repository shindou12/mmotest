<!doctype html><html><head><meta charset="utf-8"><title>試作ステージ</title>
<script type="importmap">{ "imports": { "three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/examples/jsm/" } }</script>
<style>body{margin:0;background:#000;overflow:hidden}#cap{position:fixed;left:24px;top:20px;padding:8px 18px;border-radius:10px;background:rgba(8,12,22,.8);color:#fff;font:bold 22px sans-serif;display:none}</style>
</head><body><canvas id="c"></canvas><div id="cap"></div>
<script type="module">
// 試作ステージの見本ページ。?mode=shots（4視点の静止画）/ 既定はキャラが道を歩く（ゲームと同じカメラ）
//   window.frame(t) で t 秒の絵を描く（動画の書き出し用）。ふつうに開くと実時間で動く
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { buildMeadow } from '../js/env/terrain-meadow.js';
import { PATHS } from '../shared/terrain/meadow.js';
import { makePlayer, setPlayerWeapon, animatePlayer } from '../js/models.js';
const q = new URLSearchParams(location.search), mode = q.get('mode') || 'walk';
const Wd = +(q.get('w') || innerWidth), Hd = +(q.get('h') || innerHeight);
const cv = document.getElementById('c');
const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); r.setSize(Wd, Hd);
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; r.toneMapping = THREE.ACESFilmicToneMapping;
const sc = new THREE.Scene();
const S = buildMeadow(); sc.add(S.group);
const L = S.light; sc.fog = new THREE.Fog(L.fog, L.fogNear, L.fogFar);
sc.add(new THREE.HemisphereLight(L.hemiC[0], L.hemiC[1], L.hemi));
const sun = new THREE.DirectionalLight(0xfff1d6, L.sun); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 200 }); sun.shadow.bias = -0.0005;
sc.add(sun, sun.target);
const cam = new THREE.PerspectiveCamera(50, Wd / Hd, 0.1, 1200);
const comp = new EffectComposer(r); comp.addPass(new RenderPass(sc, cam)); comp.addPass(new UnrealBloomPass(new THREE.Vector2(Wd, Hd), 0.4, 0.45, 0.95)); comp.addPass(new OutputPass());
const me = makePlayer(0x448a9b); setPlayerWeapon(me, 'sword', 3); sc.add(me);
// 歩く道: 入口 → 中央 → 石橋 → 林 → 坂道 → 台地 → 見張り塔
const route = PATHS[0].map(([x, z]) => new THREE.Vector2(x, z));
const lens = [0]; for (let i = 1; i < route.length; i++) lens.push(lens[i - 1] + route[i].distanceTo(route[i - 1]));
const SPEED = 7.2;
function along(d) {
  d = Math.min(d, lens.at(-1));
  let i = 1; while (i < lens.length - 1 && lens[i] < d) i++;
  const t = (d - lens[i - 1]) / (lens[i] - lens[i - 1]);
  return { p: route[i - 1].clone().lerp(route[i], t), a: Math.atan2(route[i].x - route[i - 1].x, route[i].y - route[i - 1].y) };
}
const cap = document.getElementById('cap');
function look(x, z, zoom, orbit = 0) {
  const y = S.heightAt(x, z) + 1.2, pitch = 0.62 + 0.3 * ((zoom - 0.55) / 1.05), dist = 19.5 * zoom;
  cam.position.set(x + Math.sin(orbit) * Math.cos(pitch) * dist, y + Math.sin(pitch) * dist, z + Math.cos(orbit) * Math.cos(pitch) * dist); cam.lookAt(x, y, z);
  sun.position.set(x + 30, y + 60, z - 20); sun.target.position.set(x, y, z);
}
let face = 0;
window.frame = (t) => {
  // 0〜6秒: 上空から全体をゆっくり回る / 6秒〜: キャラが道を歩く（ゲームのカメラ）/ 最後: 台地の縁から谷を見下ろす
  const walkT = Math.max(0, t - 6), d = walkT * SPEED, end = lens.at(-1) / SPEED;
  const { p, a } = along(d);
  face += (a - face) * 0.2;
  me.position.set(p.x, S.heightAt(p.x, p.y), p.y); me.rotation.y = face;
  animatePlayer(me, { t, moving: t > 6 && walkT < end, walkT: walkT, kind: 'sword', combo: 0, swing: -1, spin: -1, sweep: -1, dodge: 0, down: 0, hurt: 0, motion: '' });
  S.update(t, p.x, p.y);
  sc.fog.near = t < 6 ? 220 : L.fogNear; sc.fog.far = t < 6 ? 700 : L.fogFar; // 全体を見るときは霧を遠くへ
  if (t < 6) {
    const k = t / 6, an = 2.6 + k * 1.2;
    cam.position.set(Math.sin(an) * 150, 95 - k * 20, Math.cos(an) * 120); cam.lookAt(0, 0, -5);
    sun.position.set(40, 120, -30); sun.target.position.set(0, 0, 0);
    cap.textContent = '全体'; 
  } else if (walkT < end) { look(p.x, p.y, 1.25); cap.textContent = 'ゲームのカメラ'; }
  else { const k = Math.min(1, (walkT - end) / 4); look(p.x, p.y, 1.25 + k * 0.6, k * 2.6); cap.textContent = '台地から谷を見下ろす'; }
  cap.style.display = q.get('cap') ? '' : 'none';
  comp.render();
};
window.duration = () => 6 + lens.at(-1) / SPEED + 5;
if (mode === 'shots') {
  // 4視点: 全体 / 石橋 / 坂道 / 滝
  r.setScissorTest(true); r.setSize(Wd, Hd);
  const V = [{ over: true }, { x: 0, z: 12 }, { x: -28, z: -32 }, { x: 58, z: -4 }];
  S.update(3);
  V.forEach((v, i) => {
    const vx = (i % 2) * Wd / 2, vy = (i < 2 ? 1 : 0) * Hd / 2;
    r.setViewport(vx, vy, Wd / 2, Hd / 2); r.setScissor(vx, vy, Wd / 2, Hd / 2); cam.aspect = (Wd / 2) / (Hd / 2); cam.updateProjectionMatrix();
    sc.fog.near = v.over ? 220 : L.fogNear; sc.fog.far = v.over ? 700 : L.fogFar;
    if (v.over) { cam.position.set(60, 140, 150); cam.lookAt(0, 0, -5); sun.position.set(40, 120, -30); sun.target.position.set(0, 0, 0); me.visible = false; }
    else { me.visible = true; me.position.set(v.x, S.heightAt(v.x, v.z), v.z); look(v.x, v.z, 1.3); }
    r.render(sc, cam);
  });
  window.done = true;
} else if (q.get('auto') !== '0') {
  const t0 = performance.now();
  const loop = () => { window.frame(((performance.now() - t0) / 1000) % window.duration()); requestAnimationFrame(loop); };
  if (!q.get('manual')) loop();
}
window.done = true;
</script></body></html>
