<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Two new one-handed sword silhouettes</title>
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#14212b;color:#e8ece7;font:14px system-ui,"Noto Sans JP",sans-serif}
    #root{height:100vh;min-height:680px;position:relative;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%}
    header{position:absolute;left:30px;right:30px;top:24px;z-index:2}small{color:#91a8ae;letter-spacing:2px;font-size:10px}
    h1{font-size:25px;font-weight:500;margin:9px 0 6px}header p{color:#9db0b3;font-size:12px;margin:0}
    #captions{position:absolute;inset:0;pointer-events:none;z-index:1}.caption{position:absolute;padding:11px 18px;border-top:1px solid #344b51;background:linear-gradient(90deg,rgba(20,33,43,.94),rgba(20,33,43,.25))}
    .caption strong{font-size:16px;font-weight:500}.caption span{display:block;color:#91a8ae;font-size:11px;margin-top:6px;line-height:1.45}
    footer{position:absolute;left:30px;right:30px;bottom:20px;display:flex;justify-content:space-between;gap:20px;align-items:end;z-index:2}
    #note{font-size:11px;line-height:1.6;color:#9db0b3;max-width:340px}nav{display:flex;flex-wrap:wrap;justify-content:end;align-items:center;gap:8px}
    select{background:#20323d;color:#e8ece7;border:1px solid #52666a;border-radius:3px;padding:9px;font:12px system-ui,"Noto Sans JP",sans-serif}
    @media(max-width:700px){#root{min-height:800px}header{left:17px;right:17px;top:17px}h1{font-size:20px}header p{font-size:10px;line-height:1.5}.caption{padding:8px 12px}.caption strong{font-size:13px}.caption span{font-size:9px}footer{left:14px;right:14px;bottom:14px;gap:8px;align-items:end}#note{font-size:9px;max-width:140px}nav{max-width:170px;gap:5px}select{font-size:10px;padding:7px}}
  </style>
</head>
<body>
  <main id="root">
    <canvas id="scene"></canvas>
    <header><small>MMOTEST / SWORD MODEL STUDY</small><h1>Two new one-handed sword silhouettes</h1><p>One forward-hooked blade and one split-tip blade, shaped to stand apart from the current lineup.</p></header>
    <div id="captions"></div>
    <footer><div id="note">Oni Kiba and Sōsei are registered gameplay models.<br>Switch to the prior seven shapes to compare silhouettes.</div><nav id="controls"><select id="family" aria-label="Display"><option value="new">Registered new models (2)</option><option value="existing">Prior shapes (7)</option></select><select id="angle" aria-label="Angle"><option value="three-quarter">Three-quarter</option><option value="front">Front</option><option value="side">Side</option></select></nav></footer>
  </main>
  <script type="module" src="./js/previews/swords-next.js"></script>
</body>
</html>
