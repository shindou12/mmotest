<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>エフェクトの見比べ</title>
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:#10141c;color:#e8edf5;font:13px/1.5 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
    body{display:flex;flex-direction:column}
    header{padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
    h1{font-size:15px;margin:0;font-weight:600}#now{color:#ffd84a;min-width:14em}
    nav{display:flex;flex-wrap:wrap;gap:4px}
    button{background:#1d2533;color:#e8edf5;border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:3px 8px;font:inherit;cursor:pointer}
    button.on{background:#2b4a66;border-color:#7ad0ff}
    #grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;padding:0 4px 4px;min-height:0}
    .cell{position:relative;min-height:0;border-radius:6px;overflow:hidden}.cell canvas{position:absolute;inset:0;width:100%;height:100%}
    .cap{position:absolute;left:8px;top:6px;background:rgba(10,14,20,.7);padding:2px 10px;border-radius:6px;font-weight:600}
    @media(max-width:700px){#grid{grid-template-columns:1fr;grid-template-rows:repeat(4,minmax(220px,1fr))}body{height:auto}}
  </style>
</head>
<body>
  <header>
    <h1>エフェクトの見比べ（現行・A アニメ調・B 派手・A+B）</h1>
    <span id="now"></span>
    <nav id="scenes"></nav>
    <button id="slow">スロー（1/4）</button>
  </header>
  <main id="grid"></main>
  <script type="module" src="./js/previews/effects-lab.js"></script>
</body>
</html>
