<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>森の輪郭・比較</title><link rel="stylesheet" href="./style.css"></head><body><main id="root"><header><h1>森で輪郭を比べる</h1><div class="controls"><label>方法 <select id="method"><option value="silhouette">外形を拾う</option><option value="depthnormal">奥行き・面の境界</option><option value="hull">外側の殻</option></select></label><label>強さ <input id="strength" type="range" min="0" max="6" step="0.1" value="4"><output id="strengthValue">4</output></label><label>幅 <input id="width" type="range" min="0.5" max="4" step="0.1" value="1.5"><output id="widthValue">1.5</output></label><label>境界の感度 <input id="sensitivity" type="range" min="0" max="1" step="0.01" value="0.45"><output id="sensitivityValue">0.45</output></label><label><input id="bush" type="checkbox">茂みもON</label><label><input id="grass" type="checkbox">地面の草もON</label><button id="reset">視点を戻す</button></div><p id="hint"></p></header><figure><figcaption>現在｜輪郭なし</figcaption><iframe data-before src="./frame.html?map=forest_path_g3&amp;occR=0&amp;rscale=0.8" title="元の森"></iframe></figure><figure><figcaption>試作｜選んだ輪郭</figcaption><iframe data-after src="./frame.html?map=forest_path_g3&amp;occR=0&amp;rscale=0.8" title="輪郭を試した森"></iframe></figure></main><script type="module" src="./ui.js"></script></body></html>
