<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>見本｜現在｜試作 — 夜の校舎</title>
  <link rel="stylesheet" href="./compare.css">
</head>
<body>
<main>
  <header><p>AFTER HOURS / IMAGE BASED SCENE</p><h1>見本｜現在｜試作</h1>
    <p class="note">左は生成した構図案、中央は改善前の実画面、右は今回の実画面です。</p></header>
  <section class="compare">
    <figure><figcaption><strong>見本</strong><span>方向見本・生成した構図案</span></figcaption>
      <a href="./assets/direction-v2.png"><img src="./assets/direction-v2.png" alt="暗い廊下の構図案。ゲームの実画面ではありません"></a></figure>
    <figure><figcaption><strong>現在</strong><span>改善前</span></figcaption>
      <a href="./baseline.html?preview=1&bump=1"><img src="./shots/before-entrance.jpg" alt="改善前の廊下の実画面"></a></figure>
    <figure><figcaption><strong>試作</strong><span>室内視差・多方向画像・光と反射</span></figcaption>
      <a href="./?preview=1"><img src="./shots/after-entrance.jpg" alt="今回の廊下の実画面。クリックすると歩けます"></a></figure>
  </section>
  <footer>画像をクリックして拡大・起動。試作は WASD で移動、ドラッグで見回し、F で懐中電灯。</footer>
  <section class="details">
    <h2>室内視差の比較</h2>
    <div><figure><figcaption>視差なし</figcaption><img src="./shots/door-depth-off.jpg" alt="室内視差なし"></figure>
    <figure><figcaption>Interior Mapping</figcaption><img src="./shots/after-door-depth.jpg" alt="室内視差あり"></figure></div>
  </section>
</main>
</body>
</html>
