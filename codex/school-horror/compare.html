  </header>
  <section>
    <h2>暗い教室へ光を向ける</h2>
    <div class="compare">
      <figure><figcaption><strong>見本</strong><span>壁と家具の画像</span></figcaption><div class="frame materials"><a href="./assets/classroom-wall-v3.png"><img src="./assets/classroom-wall-v3.png" alt="教室の壁の2D素材"></a><a href="./assets/classroom-desk-v3.png"><img src="./assets/classroom-desk-v3.png" alt="机と椅子の透過2D素材"></a></div></figure>
      <figure><figcaption><strong>現在</strong><span>v3</span></figcaption><a class="frame" href="./current-v3.html?preview=1&still=1&shot=room-light&torch=1"><img src="./shots/v4/current-room.jpg" alt="室内は固定した明暗だったv3"></a></figure>
      <figure><figcaption><strong>試作</strong><span>v4</span></figcaption><a class="frame" href="./?preview=1&still=1&shot=room-light&torch=1"><img src="./shots/v4/room-light-on.jpg" alt="共通の環境光と懐中電灯を受け、ドアと机が光を遮るv4"></a></figure>
    </div>
  </section>
  <section>
    <h2>室内の再照明</h2>
    <div class="details">
      <figure><figcaption>室内の再照明なし</figcaption><a class="frame" href="./?preview=1&still=1&shot=room-light&torch=1&roomLight=0"><img src="./shots/v4/room-light-off.jpg" alt="廊下だけを照らし、室内への懐中電灯を切った状態"></a></figure>
      <figure><figcaption>室内の再照明あり</figcaption><a class="frame" href="./?preview=1&still=1&shot=room-light&torch=1"><img src="./shots/v4/room-light-on.jpg" alt="懐中電灯が室内の机と床にも届く状態"></a></figure>
    </div>
  </section>
  <section>
    <h2>ドアと机による遮光</h2>
    <div class="details">
      <figure><figcaption>遮光なし</figcaption><a class="frame" href="./?preview=1&still=1&shot=room-light&torch=1&roomShadow=0"><img src="./shots/v4/room-shadow-off.jpg" alt="ドアと机が懐中電灯を遮らない状態"></a></figure>
      <figure><figcaption>遮光あり</figcaption><a class="frame" href="./?preview=1&still=1&shot=room-light&torch=1"><img src="./shots/v4/room-light-on.jpg" alt="ドアと机の画像の不透明部分で光を遮る状態"></a></figure>
    </div>
  </section>
  <section>
    <h2>消灯した教室の環境光</h2>
    <div class="details">
      <figure><figcaption>以前の一定の明暗</figcaption><a class="frame" href="./?preview=1&still=1&shot=room-light&torch=1&roomAmbient=0"><img src="./shots/v4/room-ambient-off.jpg" alt="天井・壁・床に同じ明暗の係数を使った状態"></a></figure>
      <figure><figcaption>面の向きで光を受ける</figcaption><a class="frame" href="./?preview=1&still=1&shot=room-light&torch=1"><img src="./shots/v4/room-light-on.jpg" alt="廊下と同じ半球光と環境光を参照し、面の向きで明暗が変わる状態"></a></figure>
    </div>
  </section>
  <section>
    <h2>廊下・椅子・歩行後</h2>
    <div class="view-grid">
      <figure><figcaption>入口</figcaption><a class="frame" href="./?preview=1&still=1&shot=entrance"><img src="./shots/v4/entrance.jpg" alt="v4の入口からの実画面"></a></figure>
      <figure><figcaption>椅子の側面</figcaption><a class="frame" href="./?preview=1&still=1&shot=chair-side&torch=1"><img src="./shots/v4/chair-side.jpg" alt="固定した2Dの画像部品の椅子"></a></figure>
      <figure><figcaption>教室前を歩く</figcaption><a class="frame" href="./shots/v4/walk-room.jpg"><img src="./shots/v4/walk-room.jpg" alt="教室前で移動と見回しを操作した後の実画面"></a></figure>
    </div>
  </section>
  <footer>画像を押すと拡大・起動。WASDで移動、ドラッグで見回し、Fで懐中電灯。<a href="./RESEARCH-2026-10-25.md">HD-2Dの参考資料と今回の判断 ↗</a></footer>
