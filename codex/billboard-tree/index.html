<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>追従前提で作った木</title><link rel="stylesheet" href="../partial-billboard/style.css?v=large1"><script type="module" src="../partial-billboard/ui.js?v=tree2"></script>
</head><body><main id="root" data-current-follow="0.5" data-default-follow="0.65">
<header><h1>追従前提で作った木</h1><p id="status" role="status">読み込み中</p></header>
<nav aria-label="比較条件">
<label>視点 <select id="view" data-action="view"><option value="B01">標準</option><option value="near">近景</option><option value="side">横から</option><option value="oblique">斜め</option></select></label>
<label>方位 <input id="yaw" data-action="yaw" type="range" min="-180" max="180" step="1" value="0"><output id="yaw-value">0°</output></label>
<label>試作の追従 <input id="follow" data-action="follow" type="range" min="0" max="1" step="0.05" value="0.65"><output id="follow-value">0.65</output></label>
<div class="presets"><button data-action="preset" data-value="0">固定</button><button data-action="preset" data-value="0.5">半分</button><button data-action="preset" data-value="1">設計上限</button></div>
</nav>
<section class="comparison" aria-label="見本、現在、専用試作">
<figure><figcaption>見本 <span>G02・葉房のまとまり</span></figcaption><a href="/art/ref/G02.webp"><img src="/art/ref/G02.webp" alt="参考画面G02の樹冠"></a></figure>
<figure><figcaption>現在 <span>既存木へ後付け・0.5</span></figcaption><iframe id="current" src="../partial-billboard/frame.html?map=mihon2&amp;v=B01&amp;occR=0&amp;follow=0.5" title="既存木の半追従"></iframe></figure>
<figure><figcaption>専用試作 <span id="trial-label">追従 0.65</span></figcaption><iframe id="trial" src="./frame.html?map=mihon2&amp;v=B01&amp;occR=0&amp;follow=0.65" title="固定層と付け根追従を持つ専用木"></iframe></figure>
</section>
<footer>ドラッグで両方の方位を変更。専用木は固定する葉房と、付け根を支点に回る葉房を組み合わせています。回転上限38°。<a href="./README.md">制作と確認の記録</a> · <a href="../partial-billboard/">前回の比較</a> · <a href="../palm-billboard/">葉の芯を保つヤシ</a> · <a href="../palm-wind/">W1 葉の風</a></footer>
<details><summary>Blenderでの形状比較（Three.js実画面ではありません）</summary>
<div class="native">
<figure><figcaption>現在・後付け0.5</figcaption><img src="./shots/v2/current-45-0.png" alt="既存木へ後付けした半追従"></figure>
<figure><figcaption>専用木・固定</figcaption><img src="./shots/v2/designed-fixed-45-0.png" alt="専用木の追従なし"></figure>
<figure><figcaption>専用木・追従0.65</figcaption><img src="./shots/v2/designed-45-0.png" alt="専用木の追従あり"></figure>
</div></details>
</main></body></html>
