<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>W1 ヤシのゆっくりした風</title><link rel="stylesheet" href="../partial-billboard/style.css?v=large1"><script type="module" src="./ui.js?v=reference3"></script>
<style>.refcrop{display:block;position:relative;overflow:hidden;aspect-ratio:var(--preview-aspect)}.comparison .refcrop img{position:absolute;width:600%;height:auto;aspect-ratio:auto;left:50%;top:50%;transform:translate(-43%,-82%);max-width:none}.native img{aspect-ratio:16/9;object-fit:contain}#time{width:180px}</style>
</head><body><main id="root">
<header><h1>W1 ヤシのゆっくりした風</h1><p id="status" role="status">読み込み中</p></header>
<nav aria-label="比較条件">
<label>視点 <select id="view" data-action="view"><option value="B01">標準</option><option value="near">近景</option><option value="side">横から</option><option value="oblique">斜め</option><option value="top">上から</option></select></label>
<label>方位 <input id="yaw" data-action="yaw" type="range" min="-180" max="180" value="0"><output id="yaw-value">0°</output></label>
<div class="presets"><button data-action="wind" data-value="0">無風</button><button data-action="wind" data-value="0.55">弱</button><button data-action="wind" data-value="1">中</button></div>
<button id="play" data-action="play">停止</button><button data-action="reset">最初から</button>
<label>時刻 <input id="time" data-action="time" type="range" min="0" max="20" step="0.05" value="0"><output id="time-value">0.00秒</output></label>
</nav>
<section class="comparison" aria-label="見本、現在、風の試作">
<figure><figcaption>見本 <span>ユーザー提供</span></figcaption><a href="../palm-textures/reference/user-palm.png"><img src="../palm-textures/reference/user-palm.png" alt="ユーザー提供の幅広い葉のヤシ"></a></figure>
<figure><figcaption>現在 <span>直前の案・無風</span></figcaption><iframe id="current" src="../palm-billboard/frame.html?wind=0&amp;follow=0&amp;time=0&amp;paint=soft" title="直前の案の無風版"></iframe></figure>
<figure><figcaption>試作 <span id="trial-label">新案・弱い風</span></figcaption><iframe id="trial" src="../palm-billboard/frame.html?wind=0.55&amp;follow=0&amp;time=0&amp;paint=flow" title="側片が葉先へ流れる揺れるヤシ"></iframe></figure>
</section>
<footer>揺れる側は、葉の側片が葉先へ流れる新案です。カーブと樹皮は共通で、葉の画像と風が変わります。無風ボタンで材質の差を比較できます。<a href="./README.md">制作記録</a> · <a href="../palm-textures/">材質だけを比較・全体案</a> · <a href="../palm-billboard/">葉面の追従比較</a></footer>
<details open><summary>Blenderで撮影した動きと静止比較（Three.js実画面ではありません）</summary><div class="native">
<figure><figcaption>新案・弱い風・8秒</figcaption><img src="./shots/v5-flow/wind-weak.gif" alt="Blenderで撮影した葉の流れを直した弱い風"></figure>
<figure><figcaption>新案・中程度の風・8秒</figcaption><img src="./shots/v5-flow/wind-medium.gif" alt="Blenderで撮影した葉の流れを直した中程度の風"></figure>
<figure><figcaption>新案・無風</figcaption><img src="./shots/v5-flow/none-2.png" alt="新案の無風版"></figure>
<figure><figcaption>新案・弱い風・2秒</figcaption><img src="./shots/v5-flow/weak-2.png" alt="新案の弱い風の2秒時点"></figure>
<figure><figcaption>新案・中程度の風・2秒</figcaption><img src="./shots/v5-flow/medium-2.png" alt="新案の中程度の風の2秒時点"></figure>
</div></details>
</main></body></html>
