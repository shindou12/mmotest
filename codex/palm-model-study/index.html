<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ヤシの葉・形状比較</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #151a13; color: #edf0df; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1800px, 100%); margin: 0 auto; padding: 18px; }
    h1 { margin: 0 0 14px; font-size: 18px; font-weight: 600; }
    .hint { margin: -8px 0 12px; color: #bfc8a8; font-size: 12px; }
    .views { display: flex; gap: 6px; margin: 0 0 12px; }
    button { border: 1px solid #536044; border-radius: 5px; padding: 7px 18px; background: #252d20; color: inherit; font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { background: #64734c; border-color: #a5b28e; }
    .world-link { margin-left: auto; align-self: center; color: inherit; font-size: 14px; }
    .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    figure { margin: 0; min-width: 0; }
    figcaption { height: 36px; padding: 8px 10px; background: #252d20; font-size: 14px; }
    .view { height: min(76vh, 840px); min-height: 480px; background: #8a9864; }
    img, iframe { display: block; width: 100%; height: 100%; border: 0; }
    img { object-fit: contain; }
    @media (max-width: 900px) {
      main { padding: 10px; }
      .row { grid-template-columns: 1fr; }
      .view { height: min(72vh, 720px); min-height: 420px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>ヤシの葉：見本｜現在｜試作</h1>
    <p class="hint">「現在」か「試作」の3D表示を横にドラッグすると、両方が同じ角度で回ります。</p>
    <div class="views" role="group" aria-label="見る方向">
      <button type="button" data-view="B01" aria-pressed="true">斜め</button>
      <button type="button" data-view="overhead" aria-pressed="false">真上</button>
      <button type="button" data-view="side" aria-pressed="false">横</button>
      <a class="world-link" href="../palm-coast/">砂浜で見る</a>
    </div>
    <section class="row" aria-label="見本、現在、試作">
      <figure><figcaption>見本</figcaption><div class="view"><img src="../palm-study/reference/favorite-palm.png" alt="気に入ったヤシの見本"></div></figure>
      <figure><figcaption>現在</figcaption><div class="view"><iframe src="../palm-billboard/frame.html?model=palm2_a_liked_frond_v3&amp;distance=14.3" title="現在のヤシ"></iframe></div></figure>
      <figure><figcaption>試作</figcaption><div class="view"><iframe data-candidate src="../palm-billboard/frame.html?model=palm2_a_liked_frond_v4&amp;distance=14.3" title="頂部の3枚を外へ開いたヤシ"></iframe></div></figure>
    </section>
  </main>
  <script>
    const frames = [...document.querySelectorAll('iframe')];
    let state = { yaw: 0, view: 'B01' };
    const sendState = () => {
      for (const frame of frames) frame.contentWindow?.postMessage({ kind: 'leaf-state', state }, location.origin);
    };
    document.querySelector('main').addEventListener('click', event => {
      const button = event.target.closest('button[data-view]');
      if (!button) return;
      state = { yaw: 0, view: button.dataset.view };
      for (const option of document.querySelectorAll('button[data-view]')) option.setAttribute('aria-pressed', String(option === button));
      sendState();
    });
    addEventListener('message', event => {
      if (event.origin !== location.origin || !frames.some(frame => frame.contentWindow === event.source)) return;
      if (event.data?.kind === 'leaf-ready') {
        event.source.postMessage({ kind: 'leaf-state', state }, location.origin);
        return;
      }
      if (event.data?.kind !== 'leaf-orbit' || !Number.isFinite(event.data.delta)) return;
      state = { ...state, yaw: ((state.yaw + event.data.delta + 180) % 360 + 360) % 360 - 180 };
      sendState();
    });
  </script>
</body>
</html>
