<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>版の表示</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2318; }
  canvas { display: block; touch-action: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<script>
  // 親のページ（index.html）が版を決める。window.__CMP = { data, extra, module }
  const host = window.parent && window.parent !== window ? window.parent : null;
  window.__CMP = (host && host.__cmpConfig) || { data: 'L21/', extra: '', module: 'world_L22.js' };
  window.__progress = (t) => host?.__cmpProgress?.(t);
  window.__cmpReady = (api) => {
    window.__api = api;
    // Q / E で向きを回す（版を切り替えても親が向きを覚えて渡す）
    const held = new Set();
    addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); if (k === 'q' || k === 'e') held.add(k); });
    addEventListener('keyup', (e) => held.delete(e.key.toLowerCase()));
    let last = performance.now();
    (function spin(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      const d = (held.has('e') ? 1 : 0) - (held.has('q') ? 1 : 0);
      if (d) api.setYaw(api.pose().yaw + d * 70 * dt);
      requestAnimationFrame(spin);
    })(last);
    host?.__cmpOnReady?.(api, window);
  };
  addEventListener('error', (e) => host?.__cmpProgress?.('読み込めませんでした: ' + e.message, true));
  addEventListener('unhandledrejection', (e) => host?.__cmpProgress?.('読み込めませんでした: ' + (e.reason?.message || e.reason), true));
  const s = document.createElement('script'); s.type = 'module'; s.src = window.__CMP.module; document.body.appendChild(s);
</script>
</body>
</html>
